services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: societyhub_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d societyhub_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./societyhub-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/societyhub_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "8080:8080"

  web:
    build:
      context: ./societyweb
      args:
        VITE_API_BASE_URL: ${API_PUBLIC_URL:-http://localhost:8080/api/v1}
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  pgdata: